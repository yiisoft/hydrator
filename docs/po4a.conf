[po4a_langs] ru pt-BR

[po4a_paths] pot/$master.pot $lang:po/$lang/$master.po
[options] opt:"--verbose" opt:"--addendum-charset=UTF-8" opt:"--localized-charset=UTF-8" opt:"--master-charset=UTF-8" opt:"--master-language=en_US" opt:"--porefs=file" opt:"--msgmerge-opt='--no-wrap'" opt:"--wrap-po=newlines"
[po4a_alias:markdown] text opt:"--option markdown" opt:"--option keyvalue" opt:"--option yfm_keys=title,description,menu_title,details,name,text,tagline" opt:"--addendum-charset=UTF-8" opt:"--localized-charset=UTF-8" opt:"--master-charset=UTF-8" opt:"--keep=0"

[type: markdown] guide/en/README.md $lang:guide/$lang/README.md pot=README.md
[type: markdown] guide/en/attribute-resolver-factory.md $lang:guide/$lang/attribute-resolver-factory.md pot=attribute-resolver-factory.md
[type: markdown] guide/en/creating-own-attributes.md $lang:guide/$lang/creating-own-attributes.md pot=creating-own-attributes.md
[type: markdown] guide/en/general-usage.md $lang:guide/$lang/general-usage.md pot=general-usage.md
[type: markdown] guide/en/mapping.md $lang:guide/$lang/mapping.md pot=mapping.md
[type: markdown] guide/en/object-factory.md $lang:guide/$lang/object-factory.md pot=object-factory.md
[type: markdown] guide/en/typecasting.md $lang:guide/$lang/typecasting.md pot=typecasting.md
